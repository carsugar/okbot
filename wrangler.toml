name = "okbot"
main = "./src/server.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Secrets (set via `wrangler secret put <NAME>`):
# DISCORD_TOKEN
# DISCORD_PUBLIC_KEY
# DISCORD_APPLICATION_ID

[[durable_objects.bindings]]
name = "MIND_MELD"
class_name = "MindMeldGame"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MindMeldGame"]
